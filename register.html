<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

    <main>
        <div class="register-container">
            <h1>Register</h1>

            <form id="register-js" class="register-form">

                <div class="input-container">
                    <input type="text" id="username" name="username" placeholder="Username" required>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle input-icon" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder="Email" required>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope-fill input-icon" viewBox="0 0 16 16">
                        <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414z"/>
                        <path d="M0 4.697v7.104l5.803-3.558z"/>
                        <path d="M6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586z"/>
                        <path d="m9.197 8.244 6.753-4.697v7.104z"/>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="tel" id="tel" name="tel" placeholder="Phone Number" required>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-fill input-icon" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"/>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder="Password" minlength="8" required>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill input-icon" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                    </svg>
                </div>

                <div class="input-container">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" minlength="8" required>

                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-shield-fill-check input-icon" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.8 11.8 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7 7 0 0 0 1.048-.625 11.8 11.8 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.54 1.54 0 0 0-1.044-1.263 63 63 0 0 0-2.887-.87C9.843.266 8.69 0 8 0m2.146 5.146a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793z"/>
                    </svg>
                </div>

                <button type="submit">Register</button>

                <div class="login-link">
                    Already have an account?<a href="login.html">Login</a>
                </div>

            </form>
        </div>
    </main>

<script>

$(document).ready(function () {

    $("#register-js").validate({

        rules: {

            username: {
                required: true,
                minlength: 7,
                maxlength: 20
            },

            email: {
                required: true,
                email: true
            },

            tel: {
                required: true,
                minlength: 11,
                maxlength: 11,
                digits: true
            },

            password: {
                required: true,
                minlength: 8
            },

            "confirm-password": {
                required: true,
                equalTo: "#password"
            }

        },


        messages: {

            username: {
                required: "Username is required.",
                minlength: "Username should not be less than 7 characters.",
                maxlength: "Username should not exceed 20 characters."
            },

            email: {
                required: "Email is required.",
                email: "Incorrect Email format."
            },

            tel: {
                required: "Phone number is required.",
                minlength: "Phone number must be exactly 11 digits.",
                maxlength: "Phone number must be exactly 11 digits.",
                digits: "Phone number must contain digits only."
            },

            password: {
                required: "Password is required.",
                minlength: "Password must be at least 8 characters."
            },

            "confirm-password": {
                required: "Please confirm your password.",
                equalTo: "Passwords do not match."
            }

        },


        errorElement: "label",

        errorClass: "error",


        errorPlacement: function (error, element) {

            error.insertAfter(
                element.closest(".input-container")
            );

        },


        highlight: function (element) {

            $(element)
                .addClass("error")
                .removeClass("valid");

            $(element)
                .closest(".input-container")
                .addClass("has-error");

        },


        unhighlight: function (element) {

            $(element)
                .removeClass("error")
                .removeClass("valid");

            $(element)
                .closest(".input-container")
                .removeClass("has-error");

        }

    });

});

</script>


</body>
</html>
